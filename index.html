<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Anusha's Housie</title>

<style>

:root{
--bgTop:#12060c;
--bgMid:#0b0a12;
--bgBot:#070a12;

--text:#f6f2ff;
--muted:#cbbfe6;

--rose:#fb7185;
--gold:#f5c542;
--cream:#fff1d6;
}

body{
margin:0;
font-family: Georgia, serif;
color:var(--text);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:24px;

background:
radial-gradient(1100px 650px at 18% 10%, rgba(255,107,107,.22), transparent),
radial-gradient(900px 600px at 84% 0%, rgba(245,197,66,.18), transparent),
linear-gradient(180deg, var(--bgTop), var(--bgMid), var(--bgBot));
}

.wrap{
width:1100px;
display:grid;
grid-template-columns: 2fr 1fr;
gap:20px;
}

.panel{
background: rgba(255,255,255,.05);
border-radius:20px;
padding:20px;
box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.title{
font-size:28px;
font-weight:bold;
}

.badge{
background: linear-gradient(135deg, var(--gold), var(--cream));
color:black;
padding:8px 15px;
border-radius:20px;
font-weight:bold;
}

.current{
text-align:center;
padding:40px;
border-radius:20px;
background: rgba(255,255,255,.05);
margin-top:20px;
}

.word{
font-size:70px;
font-weight:bold;
margin-top:10px;
}

.status{
margin-top:15px;
}

button{
margin:10px;
padding:10px 18px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.pick{
background: linear-gradient(135deg,var(--rose),var(--gold));
color:black;
}

.secondary{
background:#333;
color:white;
}

.pickedList{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:10px;
}

.chip{
background: rgba(255,255,255,.1);
padding:6px 10px;
border-radius:10px;
font-size:12px;
}

.chip.gift{
background: gold;
color:black;
}

</style>

</head>
<body>

<div class="wrap">

<div class="panel">

<div style="display:flex;justify-content:space-between;">
<div class="title">🍷 Anusha's Housie</div>
<div class="badge" id="remainingCount">100 remaining</div>
</div>

<div class="current">

<div>Current Word</div>

<div class="word" id="currentWord">READY?</div>

<div class="status" id="statusLine"></div>

<div style="margin-top:10px;font-size:14px;">
🎁 Gift Words: ANUSHA • ASHOK • TANVI • ADVAY
</div>

</div>

<div style="text-align:center;">

<button class="pick" onclick="pickNext()">Pick Next Word</button>

<button class="secondary" onclick="undo()">Undo</button>

<button class="secondary" onclick="resetGame()">Reset</button>

</div>

</div>

<div class="panel">

<div>Picked words (<span id="pickedCount">0</span>)</div>

<div class="pickedList" id="pickedList"></div>

</div>

</div>

<script>

const GIFT_WORDS=["ANUSHA","ASHOK","TANVI","ADVAY"]

const GUARANTEE_ANUSHA_BY_PICK=15

const DEFAULT_WORDS=[

"ANUSHA","ASHOK","TANVI","ADVAY",

"FIFTY","GOLDEN","CELEBRATION","CHEERS","TOAST","HONOR",

"QUEEN","CROWN","SPARKLE","GRACE","WISDOM","LOVE","LAUGHTER",

"BLESSINGS","MEMORIES","SMILES","FAMILY","FRIENDS","JOY",

"SURPRISE","PARTY","BANQUET","BALLOONS","CONFETTI","FLOWERS",

"CAKE","CANDLES","PHOTOS","SELFIE","DANCE","MUSIC",

"GIFTS","WRAPPING","THANK YOU","WELCOME",

"CHAI","SAMOSA","BIRYANI","GULAB JAMUN","LADDU",

"GOOD HEALTH","LONG LIFE","SUCCESS","PEACE","HAPPINESS",

"STAR","HEART","SUNSHINE","GLOW","SHINE",

"DREAMS","ADVENTURE","TRAVEL","VACATION",

"HOME","TOGETHER","FOREVER","PROUD","INSPIRE",

"ROLE MODEL","LEGEND","HERO","ANGEL","SPECIAL",

"BEAUTIFUL","STRONG","KIND","CARING","WARM",

"LAZY LAUGHS","FUN","JOYFUL","BLESSED",

"NEW CHAPTER","BRIGHT FUTURE","BEST YEARS",

"CHILDHOOD","NOSTALGIA","THROWBACK",

"MOMENTS","FOREVER YOUNG","YOUNG AT HEART"

]

let pool=[...DEFAULT_WORDS]

let picked=[]

function updateUI(){

document.getElementById("remainingCount").innerText=pool.length+" remaining"

document.getElementById("pickedCount").innerText=picked.length

let html=""

picked.slice().reverse().forEach(w=>{

html+=`<div class="chip ${GIFT_WORDS.includes(w)?'gift':''}">${w}</div>`

})

document.getElementById("pickedList").innerHTML=html

}

function pickNext(){

if(pool.length==0)return

if(pool.includes("ANUSHA") && picked.length>=GUARANTEE_ANUSHA_BY_PICK-1){

pick("ANUSHA")

return

}

let rand=pool[Math.floor(Math.random()*pool.length)]

pick(rand)

}

function pick(word){

pool=pool.filter(w=>w!=word)

picked.push(word)

document.getElementById("currentWord").innerText=word

updateUI()

}

function undo(){

if(picked.length==0)return

let last=picked.pop()

pool.push(last)

updateUI()

}

function resetGame(){

pool=[...DEFAULT_WORDS]

picked=[]

document.getElementById("currentWord").innerText="READY?"

updateUI()

}

updateUI()

</script>

</body>
</html>
